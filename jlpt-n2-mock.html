いる", "考えて", "ほど", "彼が"], "answer": 1, "explain": "Order: <b>彼が 考えて いる ほど<\/b>、世の中は甘くない。"}, {"q": "私は健康のために＿＿＿ ＿＿＿ ★ ＿＿＿ことにした。", "choices": ["ジムに", "三回", "通う", "週に"], "answer": 1, "explain": "Order: 私は健康のために<b>週に 三回 ジムに 通う<\/b>ことにした。"}, {"q": "彼女は＿＿＿ ＿＿＿ ★ ＿＿＿顔で話し始めた。", "choices": ["不安が", "うその", "さっきまでの", "ような"], "answer": 2, "explain": "Order: 彼女は<b>さっきまでの 不安が うその ような<\/b>顔で話し始めた。"}]}, {"id": "m9", "section": "lang", "label": "問題9", "name": "Grammar: passage", "instruction": "次の文章を読んで、文章全体の内容を考えて、<span class='gap'>48<\/span>から<span class='gap'>52<\/span>の中に入る最もよいものを、1・2・3・4から一つ選びなさい。", "sets": [{"passage": "<p>日本各地には、さまざまな祭りがある。祭りは、もともと神様に感謝するための行事[[1]]。しかし、現在では、地域の人々が交流する場としての役割も大きくなっている。<\/p><p>[[2]]、都会に住む若者が、地方の祭りに参加するために、わざわざ出かけることもある。祭りを運営する側にとっては、参加者の減少が深刻な問題[[3]]。そのため、観光客が参加できる体験型の祭りを増やす地域も出てきた。<\/p><p>祭りが長く続いていくためには、伝統を守る[[4]]、新しい人々を受け入れる柔軟さも必要だろう。[[5]]、祭りは地域の未来を支える存在になるのではないだろうか。<\/p>", "questions": [{"q": "", "choices": ["かねない", "になる", "ようだ", "だった"], "answer": 4, "explain": "もともと...行事だった = originally was a ritual."}, {"q": "", "choices": ["むしろ", "なぜなら", "たとえば", "ところが"], "answer": 3, "explain": "Gives an example of festivals as places of exchange."}, {"q": "", "choices": ["になっている", "にしている", "にさせている", "にならない"], "answer": 1, "explain": "問題になっている = has become a problem."}, {"q": "", "choices": ["くせに", "あげく", "ばかりに", "だけでなく"], "answer": 4, "explain": "〜だけでなく = not only (preserving) but also (accepting)."}, {"q": "", "choices": ["なぜなら", "そうすれば", "ところが", "しかし"], "answer": 2, "explain": "そうすれば = if so, then. Describes the result of the previous suggestion."}]}]}, {"id": "m10", "section": "read", "label": "問題10", "name": "Short passages", "instruction": "次の(1)から(5)の文章を読んで、質問に答えなさい。答えは、1・2・3・4から一つ選びなさい。", "sets": [{"passage": "<p><b>(1)<\/b><\/p><p>【移転のお知らせ】<\/p><p>このたび、当店は3月15日に、駅の北口から南口の新しいビルに移転します。電話番号は変わりません。移転のため、3月13日と14日は休業いたします。<\/p>", "questions": [{"q": "この文章の内容と合っているものはどれか。", "choices": ["3月15日は休みになる。", "電話番号が変わる。", "駅の南口から北口に移る。", "3月13日と14日は、店が休みになる。"], "answer": 4, "explain": "The shop closes on the 13th and 14th for the move."}]}, {"passage": "<p><b>(2)<\/b><\/p><p>私は朝食をとらない日が多かった。時間がないし、食欲もなかったからだ。しかし、友人に「朝食をとると午前中に集中できる」と言われ、試しに毎朝バナナを一本食べてみた。すると、本当に午前中の仕事が楽になった。今では朝食は欠かせない。<\/p>", "questions": [{"q": "筆者は今、朝食についてどう考えているか。", "choices": ["朝食をとると、午前中の仕事が楽になると感じている。", "バナナ以外は食べないと決めている。", "食欲がないので、朝食は不要だと思っている。", "友人に朝食を作ってもらっている。"], "answer": 1, "explain": "He found mornings easier with breakfast and now never skips it."}]}, {"passage": "<p><b>(3)<\/b><\/p><p>先日はお忙しい中、工場を見学させていただき、ありがとうございました。おかげさまで、製品がどのように作られているのかがよくわかりました。つきましては、見学の際にいただいた資料の中で、不明な点がございましたので、お電話でお尋ねしてもよろしいでしょうか。<\/p>", "questions": [{"q": "この人が、メールで伝えたいことは何か。", "choices": ["製品の作り方を説明したいということ", "資料を送ってほしいということ", "資料についての質問を、電話でしてもよいかということ", "工場の見学を申し込みたいということ"], "answer": 3, "explain": "「お電話でお尋ねしてもよろしいでしょうか」 is the request."}]}, {"passage": "<p><b>(4)<\/b><\/p><p>「断る力」も、大切な能力の一つだ。人に頼まれると、つい引き受けてしまう人は多い。しかし、無理をして引き受けると、仕事の質が下がり、結局は相手にも迷惑をかけることになる。断るときは、理由を簡潔に伝え、代わりにできることを提案すると、相手も納得しやすい。<\/p>", "questions": [{"q": "筆者の考えに合うものはどれか。", "choices": ["どんな依頼も、まず引き受けるべきだ。", "断るときは、理由を言わないほうがよい。", "無理な依頼は、理由を伝えて断ったほうがよい。", "断ると、必ず相手に迷惑がかかる。"], "answer": 3, "explain": "Taking on too much hurts quality; decline with a brief reason and an alternative."}]}, {"passage": "<p><b>(5)<\/b><\/p><p>【図書館からのお知らせ】<\/p><p>10月1日から、貸出期間を2週間から3週間に延長します。借りられる本の数は、これまでどおり1人5冊までです。延長の手続きは、インターネットでもできます。<\/p>", "questions": [{"q": "10月1日から何が変わるか。", "choices": ["貸出期間が短くなる。", "本を借りられる期間が長くなる。", "手続きは窓口でしかできなくなる。", "借りられる本の数が増える。"], "answer": 2, "explain": "The loan period goes from two weeks to three."}]}]}, {"id": "m11", "section": "read", "label": "問題11", "name": "Mid-length passages", "instruction": "次の(1)から(3)の文章を読んで、質問に答えなさい。答えは、1・2・3・4から一つ選びなさい。", "sets": [{"passage": "<p><b>(1)<\/b><\/p><p>日本では、コンビニエンスストアの数が、全国で五万店を超えている。商品を買うだけでなく、公共料金の支払いや荷物の受け取り、チケットの購入など、さまざまなサービスが利用できる。二十四時間営業という便利さから、生活に欠かせない存在になっている。<\/p><p>一方で、問題も指摘されている。深夜に働く店員の負担が大きく、人手不足が深刻だ。また、売れ残った食品を大量に捨てることも、環境の面から批判されている。<\/p><p>最近では、一部の店が深夜営業をやめたり、売れ残りそうな商品を値引きして売ったりする取り組みを始めた。便利さを保ちながら、人や環境への負担を減らす工夫が求められている。<\/p>", "questions": [{"q": "コンビニで利用できるサービスとして、文章に挙げられていないものはどれか。", "choices": ["チケットの購入", "荷物の受け取り", "銀行の口座を開くこと", "公共料金の支払い"], "answer": 3, "explain": "Bank accounts aren't mentioned."}, {"q": "問題点として指摘されていることは何か。", "choices": ["商品の値段が高いこと", "深夜に働く店員の負担が大きいこと", "店の数が少ないこと", "荷物の受け取りに時間がかかること"], "answer": 2, "explain": "Paragraph 2: heavy burden on night staff and food waste."}, {"q": "最近の取り組みとして、文章に書かれているものはどれか。", "choices": ["店員を増やすために値上げした。", "売れ残りそうな商品を、値引きして売る。", "食品の販売をやめた。", "すべての店が二十四時間営業をやめた。"], "answer": 2, "explain": "Some stores discount items likely to go unsold."}]}, {"passage": "<p><b>(2)<\/b><\/p><p>先日、小学生の娘に「どうして勉強しなければならないの？」と聞かれ、答えに困った。「将来のため」と答えたが、娘は納得しなかった。<\/p><p>そこで私は、自分の経験を話すことにした。若いころ、外国語を勉強していたおかげで、旅先で出会った人たちと話せて、とても楽しかったこと。勉強は、世界を広げる道具になることを伝えた。すると、娘は少し興味を持ったようで、「じゃあ、英語を勉強してみる」と言った。<\/p><p>子どもに必要なのは、「やりなさい」という命令より、勉強の楽しさが伝わる経験なのかもしれない。<\/p>", "questions": [{"q": "「将来のため」という筆者の答えに、娘はどうしたか。", "choices": ["泣き出した。", "納得しなかった。", "勉強をやめた。", "英語を勉強すると言った。"], "answer": 2, "explain": "She wasn't convinced."}, {"q": "筆者が娘に話したことは何か。", "choices": ["外国語を勉強したおかげで、旅先で人と話せて楽しかったという経験", "将来の仕事の大変さ", "娘の友達の話", "自分が勉強を嫌いだったこと"], "answer": 1, "explain": "He told her about enjoying conversations while traveling thanks to language study."}, {"q": "筆者の考えに合うものはどれか。", "choices": ["子どもには、「やりなさい」と言うべきだ。", "命令より、勉強の楽しさが伝わる経験が必要かもしれない。", "勉強は将来のためだけにするものだ。", "外国語だけが重要だ。"], "answer": 2, "explain": "The last paragraph."}]}, {"passage": "<p><b>(3)<\/b><\/p><p>商品の価格は、需要と供給で決まるといわれる。欲しい人が多ければ価格は上がり、少なければ下がる。たとえば、人気のコンサートのチケットは、すぐに売り切れ、高値で転売されることもある。<\/p><p>この転売行為は、社会問題になっている。本当に行きたい人が定価で買えなくなるからだ。そのため、チケットの転売を禁止する法律ができた。しかし、規制だけで問題が解決するわけではない。購入者が高値でも買う限り、転売をする人はいなくならないからだ。<\/p><p>結局のところ、私たち一人一人が、不正な転売を利用しないという意識を持つことが重要である。<\/p>", "questions": [{"q": "商品の価格について、筆者はどう述べているか。", "choices": ["店が自由に決める。", "法律で決まっている。", "いつも一定である。", "欲しい人が多いと上がり、少ないと下がる。"], "answer": 4, "explain": "Paragraph 1: supply and demand."}, {"q": "転売が問題とされる理由は何か。", "choices": ["法律ができたから", "チケットの値段が下がるから", "本当に行きたい人が、定価で買えなくなるから", "コンサートが中止になるから"], "answer": 3, "explain": "Paragraph 2."}, {"q": "筆者の考えに合うものはどれか。", "choices": ["価格は需要で決めるべきではない。", "一人一人が、不正な転売を利用しない意識を持つことが重要だ。", "法律ができたので、問題は解決した。", "転売は自由にさせるべきだ。"], "answer": 2, "explain": "The conclusion: individual awareness."}]}]}, {"id": "m12", "section": "read", "label": "問題12", "name": "Integrated comprehension", "instruction": "次のAとBの文章を読んで、質問に答えなさい。答えは、1・2・3・4から一つ選びなさい。", "sets": [{"passage": "<p><b>A<\/b><\/p><p>私は、地方で暮らすほうがよいと思う。自然が豊かで空気もきれいなうえ、家賃も安く、広い家に住める。人間関係も温かく、子育てにも向いている。<\/p><p><b>B<\/b><\/p><p>私は、都会で暮らす利点は大きいと思う。仕事の選択肢が多く、交通も便利で、病院や店も近くにある。刺激も多く、さまざまな人と出会える。ただし、家賃が高く、騒がしいのは欠点である。<\/p>", "questions": [{"q": "家賃について、AとBはどのように述べているか。", "choices": ["AもBも、家賃には触れていない。", "Aは都会は安いと述べ、Bは地方は高いと述べている。", "Aは地方は安いと述べ、Bは都会は高いと述べている。", "AもBも、都会は安いと述べている。"], "answer": 3, "explain": "A: rent is cheap in rural areas. B: rent is high in cities."}, {"q": "AとBは、何を重視して暮らす場所を考えているか。", "choices": ["Aは自然や子育てのしやすさを、Bは仕事や交通の便利さを重視している。", "Aは仕事の多さを、Bは自然の豊かさを重視している。", "AもBも、家賃の安さだけを重視している。", "AもBも、人間関係の温かさだけを重視している。"], "answer": 1, "explain": "A: nature, childcare. B: jobs, transport, facilities."}]}]}, {"id": "m13", "section": "read", "label": "問題13", "name": "Long passage (argument)", "instruction": "次の文章を読んで、質問に答えなさい。答えは、1・2・3・4から一つ選びなさい。", "sets": [{"passage": "<p>「本を読む時間がない」という声をよく聞く。しかし、実際には、スマートフォンを見る時間は一日に何時間もあるのではないか。問題は時間ではなく、優先順位だと私は思う。<\/p><p>読書の利点は、知識が増えることだけではない。本を読むと、他人の気持ちや考え方を想像する力が育つ。小説なら、登場人物の立場になって、物語の世界を体験できる。この経験が、現実の人間関係でも、相手を理解する助けになる。<\/p><p>また、本は自分のペースで読める点もいい。動画のように、一方的に情報が流れてくるのではなく、わからないところは戻って読み直し、立ち止まって考えることができる。<\/p><p>もちろん、無理に本を読む必要はない。ただ、一日十分でも本に触れる習慣を持つことは、心を豊かにする小さな投資になるのではないだろうか。<\/p>", "questions": [{"q": "「本を読む時間がない」という意見について、筆者はどう考えているか。", "choices": ["時間ではなく、優先順位の問題だと考えている。", "本当に時間がなく、仕方がないと考えている。", "忙しい人は読書をしなくてよいと考えている。", "スマートフォンを見る時間を増やすべきだと考えている。"], "answer": 1, "explain": "Paragraph 1: it's a matter of priorities, not time."}, {"q": "小説を読む利点として、筆者が述べているものはどれか。", "choices": ["現実の人間関係を避けられること", "動画より早く情報が得られること", "登場人物の立場になって、他人の気持ちを想像する力が育つこと", "知識だけが増えること"], "answer": 3, "explain": "Paragraph 2."}, {"q": "この文章で、筆者が最も言いたいことは何か。", "choices": ["一日十分でも読書の習慣を持つことは、心を豊かにする。", "本は動画より優れている。", "すべての人が、毎日長時間本を読むべきだ。", "読書は知識を増やすためだけにある。"], "answer": 1, "explain": "The final paragraph."}]}]}, {"id": "m14", "section": "read", "label": "問題14", "name": "Information retrieval", "instruction": "下のページは、ある区民センターの講座の案内である。これを読んで、下の質問に答えなさい。答えは、1・2・3・4から一つ選びなさい。", "sets": [{"passage": "<p><b>スマートフォン　料金プラン<\/b><\/p><table class='info'><thead><tr><th>プラン<\/th><th>月額<\/th><th>データ量<\/th><th>通話<\/th><\/tr><\/thead><tbody><tr><td>A　ライト<\/td><td>1,500円<\/td><td>3GB<\/td><td>30秒ごとに22円<\/td><\/tr><tr><td>B　スタンダード<\/td><td>3,000円<\/td><td>20GB<\/td><td>5分以内の通話は無料<\/td><\/tr><tr><td>C　たっぷり<\/td><td>4,500円<\/td><td>無制限<\/td><td>かけ放題<\/td><\/tr><tr><td>D　シンプル<\/td><td>800円<\/td><td>1GB<\/td><td>30秒ごとに22円<\/td><\/tr><\/tbody><\/table><p>・家族で2人以上が同じプランに申し込むと、1人につき月額から500円引きになります。<\/p>", "questions": [{"q": "鈴木さんは、月に10GBほどデータを使い、電話はほとんどしない。いちばん安く利用できるプランはどれか。", "choices": ["シンプル", "たっぷり", "ライト", "スタンダード"], "answer": 4, "explain": "Only B (20GB) and C have enough data, and B is cheaper."}, {"q": "田中さん夫婦が、二人ともスタンダードに申し込む。二人の月額の合計はいくらか。", "choices": ["4,000円", "5,500円", "6,000円", "5,000円"], "answer": 4, "explain": "(3,000 − 500) × 2 = 5,000 yen."}]}]}]}, {"id": "n2-week-05", "title": "N2 Mock Test", "subtitle": "Week 5", "minutes": 105, "parts": [{"id": "m1", "section": "lang", "label": "問題1", "name": "Kanji reading", "instruction": "<u>　　　<\/u>の言葉の読み方として最もよいものを、1・2・3・4から一つ選びなさい。", "questions": [{"q": "落ち込んでいる友人を<u>慰めた<\/u>。", "choices": ["なぐさめた", "なやめた", "いたわった", "なだめた"], "answer": 1, "explain": "慰める (なぐさめる) = to comfort."}, {"q": "彼は<u>勇敢<\/u>に立ち向かった。", "choices": ["ゆかん", "ゆうがん", "ようかん", "ゆうかん"], "answer": 4, "explain": "勇敢 (ゆうかん) = brave."}, {"q": "秋は<u>収穫<\/u>の季節だ。", "choices": ["しゅがく", "しゅかく", "しゅうかく", "しゅうがく"], "answer": 3, "explain": "収穫 (しゅうかく) = harvest."}, {"q": "荷物の<u>重量<\/u>を量る。", "choices": ["じゅうりょく", "じゅりょう", "じゅうりょ", "じゅうりょう"], "answer": 4, "explain": "重量 (じゅうりょう) = weight. 重力 (じゅうりょく) is gravity."}, {"q": "彼は決して夢を<u>諦めない<\/u>。", "choices": ["あきらめない", "あきれない", "ためらわない", "あきたない"], "answer": 1, "explain": "諦める (あきらめる) = to give up."}]}, {"id": "m2", "section": "lang", "label": "問題2", "name": "Kanji writing", "instruction": "<u>　　　<\/u>の言葉を漢字で書くとき、最もよいものを、1・2・3・4から一つ選びなさい。", "questions": [{"q": "日本の<u>ぶんか<\/u>を学んでいる。", "choices": ["文科", "文化", "分化", "聞化"], "answer": 2, "explain": "文化 = culture."}, {"q": "自分の<u>けってん<\/u>を直したい。", "choices": ["欠点", "欠店", "決点", "決店"], "answer": 1, "explain": "欠点 = flaw, shortcoming."}, {"q": "商品の<u>はいたつ<\/u>を頼んだ。", "choices": ["配連", "排達", "配達", "排連"], "answer": 3, "explain": "配達 = delivery."}, {"q": "仕事に<u>つかれて<\/u>、早く寝た。", "choices": ["疲れて", "被れて", "彼れて", "披れて"], "answer": 1, "explain": "疲れる = to get tired. Watch the look-alike 披・被・彼."}, {"q": "みんなの意見を<u>あつめる<\/u>。", "choices": ["集める", "衆める", "雑める", "隹める"], "answer": 1, "explain": "集める = to collect."}]}, {"id": "m3", "section": "lang", "label": "問題3", "name": "Word formation", "instruction": "（　　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。", "questions": [{"q": "この製品は、（　　）完全なまま発売された。", "choices": ["不", "未", "非", "無"], "answer": 1, "explain": "不完全 = incomplete, imperfect."}, {"q": "日本企業の国際（　　）が進んでいる。", "choices": ["式", "性", "的", "化"], "answer": 4, "explain": "国際化 = internationalization."}, {"q": "会議（　　）に、電話が鳴った。", "choices": ["最", "内", "中", "間"], "answer": 3, "explain": "会議中 = during the meeting."}]}, {"id": "m4", "section": "lang", "label": "問題4", "name": "Contextual vocabulary", "instruction": "（　　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。", "questions": [{"q": "彼は約束の時間に（　　）して、友人を待たせた。", "choices": ["遅速", "遅延", "遅配", "遅刻"], "answer": 4, "explain": "遅刻 = being late (for a person)."}, {"q": "新商品が（　　）を呼んで、売り上げが伸びた。", "choices": ["批判", "判決", "判断", "評判"], "answer": 4, "explain": "評判を呼ぶ = to become the talk of the town."}, {"q": "風邪をひいたので、今日は（　　）寝ることにした。", "choices": ["はっきり", "うっかり", "ゆっくり", "ざっと"], "answer": 3, "explain": "ゆっくり = slowly, at leisure."}, {"q": "彼はいつも（　　）な服を着ている。", "choices": ["地盤", "地味", "地元", "地道"], "answer": 2, "explain": "地味 = plain, subdued."}, {"q": "資料を（　　）して、全員に配った。", "choices": ["目印", "印鑑", "印刷", "印象"], "answer": 3, "explain": "印刷 = printing."}, {"q": "彼女は人前で話すのが（　　）で、緊張してしまう。", "choices": ["苦手", "派手", "乱暴", "勝手"], "answer": 1, "explain": "苦手 = not good at, uneasy with."}, {"q": "雨が降りそうだったので、洗濯物を（　　）取り込んだ。", "choices": ["あわてて", "あきらめて", "あやまって", "あらためて"], "answer": 1, "explain": "あわてて = in a hurry, flustered."}]}, {"id": "m5", "section": "lang", "label": "問題5", "name": "Synonyms", "instruction": "<u>　　　<\/u>の言葉に意味が最も近いものを、1・2・3・4から一つ選びなさい。", "questions": [{"q": "彼女は<u>ついに<\/u>夢をかなえた。", "choices": ["最初から", "たまたま", "少しずつ", "とうとう"], "answer": 4, "explain": "ついに = finally, at last."}, {"q": "部屋が<u>散らかって<\/u>いる。", "choices": ["物がきちんと片づいていない", "狭い", "とても暗い", "物が少ない"], "answer": 1, "explain": "散らかる = to be messy, scattered about."}, {"q": "彼は<u>気まずい<\/u>顔をした。", "choices": ["怒った", "うれしそうな", "雰囲気が悪くて居心地が悪そうな", "疲れた"], "answer": 3, "explain": "気まずい = awkward, uncomfortable."}, {"q": "この商品は<u>割安<\/u>だ。", "choices": ["品質のわりに値段が安い", "とても高い", "すぐ壊れる", "人気がない"], "answer": 1, "explain": "割安 = a good deal for the quality."}, {"q": "約束の日を<u>ずらす<\/u>。", "choices": ["忘れる", "取り消す", "別の日に変える", "早めに決める"], "answer": 3, "explain": "ずらす = to shift, move to a different time."}]}, {"id": "m6", "section": "lang", "label": "問題6", "name": "Usage", "instruction": "次の言葉の使い方として最もよいものを、1・2・3・4から一つ選びなさい。", "questions": [{"q": "<b>ふと<\/b>", "choices": ["ふと計画を立てて旅行した。", "ふと勉強したので合格した。", "ふと空を見上げると、きれいな虹が出ていた。", "毎日ふと運動を続けている。"], "answer": 3, "explain": "ふと = suddenly, by chance (without intention)."}, {"q": "<b>ともかく<\/b>", "choices": ["家族とともかく旅行した。", "ともかく昨日の夜は雨だった。", "ともかくの本を借りた。", "理由はともかく、まず謝るべきだ。"], "answer": 4, "explain": "〜はともかく = setting X aside."}, {"q": "<b>慌ただしい<\/b>", "choices": ["年末は仕事が多くて、慌ただしい毎日だ。", "慌ただしい水を飲んだ。", "慌ただしい海を眺めた。", "慌ただしい音楽を聞いて眠った。"], "answer": 1, "explain": "慌ただしい = hectic, rushed."}, {"q": "<b>備える<\/b>", "choices": ["試験に備えて、友達と遊びに行った。", "駅に備えて電車に乗った。", "地震に備えて、水と食料を用意した。", "風邪を備えて薬を飲んだ。"], "answer": 3, "explain": "〜に備える = to prepare for."}, {"q": "<b>引き止める<\/b>", "choices": ["ボタンを引き止めて、音を出した。", "本を引き止めて、棚に戻した。", "帰ろうとする友人を引き止めて、もう一杯お茶を飲んだ。", "犬を引き止めて、散歩に行った。"], "answer": 3, "explain": "引き止める = to hold someone back, stop someone leaving."}]}, {"id": "m7", "section": "lang", "label": "問題7", "name": "Grammar: sentence", "instruction": "次の文の（　　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。", "questions": [{"q": "彼は教師（　　）、生徒の気持ちがわからない。", "choices": ["をはじめ", "のくせに", "だけあって", "につき"], "answer": 2, "explain": "〜のくせに = even though (criticism)."}, {"q": "現金（　　）、カードでもお支払いいただけます。", "choices": ["くせに", "せいで", "ばかりに", "はもちろん"], "answer": 4, "explain": "〜はもちろん = of course, not to mention."}, {"q": "昨日は寒かった（　　）、今日は暖かい。", "choices": ["のに対して", "のにあたって", "のを問わず", "のをきっかけに"], "answer": 1, "explain": "〜のに対して = in contrast to."}, {"q": "読み（　　）の本が、机の上に置いてある。", "choices": ["がち", "ぶり", "かけ", "ぎみ"], "answer": 3, "explain": "V-stem + かけの = half-done."}, {"q": "彼が犯人な（　　）。", "choices": ["ところだ", "わけがない", "わけにはいかない", "ことはない"], "answer": 2, "explain": "〜わけがない = there's no way that."}, {"q": "彼女は自分の失敗を認め（　　）、言い訳ばかりしている。", "choices": ["ようともせず", "がたく", "ざるを得ず", "かねず"], "answer": 1, "explain": "V-volitional + ともせず = not even trying to."}, {"q": "この薬は苦くて飲み（　　）。", "choices": ["にくい", "やすい", "だし", "すぎ"], "answer": 1, "explain": "V-stem + にくい = hard to."}, {"q": "買い物に行く（　　）、郵便局に寄ってきた。", "choices": ["あげく", "くせに", "せいで", "ついでに"], "answer": 4, "explain": "〜ついでに = while at it."}, {"q": "たとえ失敗した（　　）、挑戦する価値はある。", "choices": ["からには", "としても", "とすれば", "ばかりに"], "answer": 2, "explain": "たとえ〜としても = even if."}, {"q": "傘を持っていない日（　　）、雨が降る。", "choices": ["をめぐって", "に限って", "に応じて", "にとって"], "answer": 2, "explain": "〜に限って = of all days, just when."}, {"q": "プレゼントをもらって、うれしくて（　　）。", "choices": ["わけにはいかない", "ようがない", "かねない", "たまらない"], "answer": 4, "explain": "〜てたまらない = can't help feeling, extremely."}, {"q": "もう少しで電車に乗り遅れる（　　）。", "choices": ["ものだった", "わけだった", "ところだった", "はずだった"], "answer": 3, "explain": "〜ところだった = almost happened."}]}, {"id": "m8", "section": "lang", "label": "問題8", "name": "Grammar: ordering (★)", "instruction": "次の文の　★　に入る最もよいものを、1・2・3・4から一つ選びなさい。", "questions": [{"q": "この店は＿＿＿ ＿＿＿ ★ ＿＿＿ので、とても静かだ。", "choices": ["ところにある", "入った", "大通りから", "一本"], "answer": 2, "explain": "Order: この店は<b>大通りから 一本 入った ところにある<\/b>ので、とても静かだ。"}, {"q": "先生に＿＿＿ ★ ＿＿＿ ＿＿＿うれしかった。", "choices": ["ほめて", "いただいた", "何より", "ことが"], "answer": 2, "explain": "Order: 先生に<b>ほめて いただいた ことが 何より<\/b>うれしかった。"}, {"q": "彼は＿＿＿ ＿＿＿ ★ ＿＿＿働いている。", "choices": ["一生懸命", "ほど", "壊す", "体を"], "answer": 2, "explain": "Order: 彼は<b>体を 壊す ほど 一生懸命<\/b>働いている。"}, {"q": "定年を＿＿＿ ＿＿＿ ★ ＿＿＿、仕事を続けるつもりだ。", "choices": ["限り", "迎えて", "元気な", "からも"], "answer": 3, "explain": "Order: 定年を<b>迎えて からも 元気な 限り<\/b>、仕事を続けるつもりだ。"}, {"q": "彼女は＿＿＿ ＿＿＿ ★ ＿＿＿話しかけてきた。", "choices": ["よく", "知っている", "私を", "かのように"], "answer": 2, "explain": "Order: 彼女は<b>私を よく 知っている かのように<\/b>話しかけてきた。"}]}, {"id": "m9", "section": "lang", "label": "問題9", "name": "Grammar: passage", "instruction": "次の文章を読んで、文章全体の内容を考えて、<span class='gap'>48<\/span>から<span class='gap'>52<\/span>の中に入る最もよいものを、1・2・3・4から一つ選びなさい。", "sets": [{"passage": "<p>最近は、スマートフォンの翻訳アプリを使えば、外国語が話せなくても、旅行先で簡単に会話ができる[[1]]。精度も年々上がっており、日常会話ならほとんど問題がない。<\/p><p>[[2]]、ビジネスや法律の文書など、正確さが重要な場面では、人間の翻訳者が必要とされている。機械は言葉の意味を訳すことはできる[[3]]、その場の雰囲気や相手の気持ちまで理解することは難しいからだ。<\/p><p>[[4]]、翻訳アプリが普及しても、外国語を学ぶ意味がなくなる[[5]]。言葉を学ぶことは、その国の文化や考え方を知ることでもあるからだ。<\/p>", "questions": [{"q": "", "choices": ["ようになった", "ことはない", "ばかりだ", "ことにした"], "answer": 1, "explain": "会話ができるようになった = has become able to converse."}, {"q": "", "choices": ["たとえば", "そのうえ", "したがって", "しかし"], "answer": 4, "explain": "Casual conversation is fine; but accuracy matters elsewhere."}, {"q": "", "choices": ["せいで", "ものの", "ために", "おかげで"], "answer": 2, "explain": "〜ものの = although."}, {"q": "", "choices": ["むしろ", "したがって", "ところが", "なぜなら"], "answer": 2, "explain": "Therefore: machines can't read context, so learning languages still matters."}, {"q": "", "choices": ["はずだった", "わけではない", "ようにしている", "ことにする"], "answer": 2, "explain": "〜わけではない = it doesn't mean that."}]}]}, {"id": "m10", "section": "read", "label": "問題10", "name": "Short passages", "instruction": "次の(1)から(5)の文章を読んで、質問に答えなさい。答えは、1・2・3・4から一つ選びなさい。", "sets": [{"passage": "<p><b>(1)<\/b><\/p><p>【駅のお知らせ】<\/p><p>ご利用ありがとうございます。この電車は、事故のため、現在運転を見合わせております。運転再開の時間は未定です。お急ぎのお客様は、バスなどをご利用ください。<\/p>", "questions": [{"q": "この放送の内容と合っているものはどれか。", "choices": ["電車は30分後に動き出す。", "電車は混雑している。", "バスは運休している。", "電車がいつ動くかは、まだわからない。"], "answer": 4, "explain": "「運転再開の時間は未定」 = the restart time is undecided."}]}, {"passage": "<p><b>(2)<\/b><\/p><p>私の祖父は、毎朝同じ時間に散歩に出かける。雨の日も雪の日も欠かさない。「何のために歩くの？」と聞くと、「歩くのが目的で、理由はない」と笑って答えた。理由を探さず、ただ続ける。その姿勢が、祖父の元気の秘密なのかもしれない。<\/p>", "questions": [{"q": "筆者は、祖父についてどう思っているか。", "choices": ["健康のためだけに歩いていると思っている。", "散歩の理由を聞かれて怒ったと思っている。", "理由を探さずに続ける姿勢が、元気の秘密かもしれないと思っている。", "雨の日は休むべきだと思っている。"], "answer": 3, "explain": "The last line: continuing without hunting for reasons may be his secret."}]}, {"passage": "<p><b>(3)<\/b><\/p><p>【会議のお知らせ】<\/p><p>会議の資料は、事前にメールでお送りします。当日は、資料を印刷して持ってくる必要はありません。会議室のスクリーンに映しますので、パソコンだけお持ちください。<\/p>", "questions": [{"q": "会議の当日、参加者は何を持っていけばよいか。", "choices": ["印刷した資料", "会議のあとで受け取る資料", "パソコン", "スクリーン"], "answer": 3, "explain": "Only a PC is needed; materials are shown on the screen."}]}, {"passage": "<p><b>(4)<\/b><\/p><p>「早起きは三文の徳」ということわざがあるが、必ずしも誰にとっても朝型が有利とは限らない。人によって、頭が冴える時間帯は異なるからだ。大切なのは、自分に合った生活リズムを知り、その時間に重要な仕事をすることだろう。<\/p>", "questions": [{"q": "筆者の考えに合うものはどれか。", "choices": ["ことわざはまったく間違っている。", "自分に合った生活リズムを知り、それに合わせて活動するのがよい。", "誰でも早起きをすれば得をする。", "夜型の人は生活を変えるべきだ。"], "answer": 2, "explain": "The sharpest time of day differs by person; know your own rhythm."}]}, {"passage": "<p><b>(5)<\/b><\/p><p>【忘れ物について】<\/p><p>忘れ物をされた方は、1階の受付までお問い合わせください。保管期間は1か月です。1か月を過ぎたものは、処分させていただきます。<\/p>", "questions": [{"q": "この文章の内容と合っているものはどれか。", "choices": ["保管期間は3か月である。", "1か月過ぎたら、受付で買い取れる。", "1か月以内に、受付に問い合わせる必要がある。", "忘れ物は、2階に取りに行く。"], "answer": 3, "explain": "Items are kept for one month, then disposed of."}]}]}, {"id": "m11", "section": "read", "label": "問題11", "name": "Mid-length passages", "instruction": "次の(1)から(3)の文章を読んで、質問に答えなさい。答えは、1・2・3・4から一つ選びなさい。", "sets": [{"passage": "<p><b>(1)<\/b><\/p><p>近年、「サブスクリプション」と呼ばれる定額制のサービスが広がっている。毎月一定の料金を払えば、音楽や動画、本などを好きなだけ利用できる。利用者にとっては、一つ一つ買うよりも安く済み、新しい作品に出会いやすいという利点がある。<\/p><p>しかし、問題もある。利用していないサービスの料金を払い続けてしまう人が少なくないのだ。契約したことを忘れたまま、毎月お金が引かれているケースもある。<\/p><p>サービスを賢く使うためには、定期的に契約内容を見直すことが欠かせない。本当に必要なものだけを残す意識が、無駄な出費を防ぐ。<\/p>", "questions": [{"q": "定額制サービスの利点として、文章に書かれているものはどれか。", "choices": ["作品を自分のものにできる。", "解約が簡単である。", "一つ一つ買うより安く済み、新しい作品に出会いやすい。", "必ず他の方法より安い。"], "answer": 3, "explain": "Paragraph 1."}, {"q": "問題点として、文章に書かれているものはどれか。", "choices": ["料金が毎月変わること", "使っていないサービスの料金を、払い続けてしまうこと", "作品の数が少ないこと", "契約の手続きが難しいこと"], "answer": 2, "explain": "Paragraph 2."}, {"q": "筆者の考えに合うものはどれか。", "choices": ["契約を忘れてしまうのは仕方がない。", "サービスはすべてやめるべきだ。", "安いサービスだけを契約するべきだ。", "定期的に契約を見直し、必要なものだけを残すべきだ。"], "answer": 4, "explain": "Paragraph 3."}]}, {"passage": "<p><b>(2)<\/b><\/p><p>私の職場には、毎朝「今日の一言」を発表するルールがある。最初は、ただの形式だと思っていた。ところが、続けるうちに、同僚の意外な一面を知るようになった。無口な人が趣味の話を楽しそうにしたり、厳しい上司が家族の話をしたりする。<\/p><p>そうしたやり取りがあるおかげで、仕事の相談もしやすくなった。小さな習慣でも、人間関係を変える力があると感じる。<\/p>", "questions": [{"q": "筆者は、このルールを最初はどう思っていたか。", "choices": ["同僚を知るよい機会だと思っていた。", "ただの形式だと思っていた。", "仕事の効率が上がると思っていた。", "上司だけが話すものだと思っていた。"], "answer": 2, "explain": "「最初は、ただの形式だと思っていた」"}, {"q": "続けるうちに、筆者にどんな変化があったか。", "choices": ["発表がうまくなった。", "上司に評価された。", "仕事が減った。", "同僚の意外な一面を知るようになった。"], "answer": 4, "explain": "He learned unexpected sides of his colleagues."}, {"q": "筆者の考えに合うものはどれか。", "choices": ["上司の話がいちばん大切だ。", "小さな習慣でも、人間関係を変える力がある。", "習慣は形式にすぎない。", "発表は趣味の話だけにすべきだ。"], "answer": 2, "explain": "The last sentence."}]}, {"passage": "<p><b>(3)<\/b><\/p><p>日本の夏は、年々暑くなっている。熱中症で救急搬送される人も増えた。そこで注目されているのが、「クールシェア」という考え方だ。これは、各家庭で冷房を使う代わりに、図書館や商業施設など、涼しい場所に人が集まって過ごすことで、電力を節約しようという取り組みである。<\/p><p>家にいても冷房を使わずに我慢すると、かえって熱中症の危険が高まる。クールシェアなら、安全に涼しく過ごせるうえ、電気の使用量も減らせる。さらに、人との交流が生まれるという効果もある。<\/p><p>ただし、外出が難しい高齢者への配慮が必要だ。地域で声をかけ合うなど、誰もが利用できる仕組みを作ることが課題になっている。<\/p>", "questions": [{"q": "「クールシェア」とは、どんな取り組みか。", "choices": ["涼しい場所に集まって過ごし、電力を節約する取り組み", "商業施設が冷房を無料で配る取り組み", "冷房の設定温度を上げる取り組み", "各家庭で冷房を使わずに我慢する取り組み"], "answer": 1, "explain": "Paragraph 1."}, {"q": "クールシェアの効果として、文章に挙げられていないものはどれか。", "choices": ["人との交流が生まれること", "安全に涼しく過ごせること", "電気の使用量が減ること", "暑さに強い体になること"], "answer": 4, "explain": "Not mentioned: building a heat-resistant body."}, {"q": "この取り組みの課題として、文章に書かれているものはどれか。", "choices": ["外出が難しい高齢者への配慮", "施設の数が多すぎること", "熱中症の人が増えること", "電力が足りなくなること"], "answer": 1, "explain": "Paragraph 3."}]}]}, {"id": "m12", "section": "read", "label": "問題12", "name": "Integrated comprehension", "instruction": "次のAとBの文章を読んで、質問に答えなさい。答えは、1・2・3・4から一つ選びなさい。", "sets": [{"passage": "<p><b>A<\/b><\/p><p>キャッシュレス決済は、積極的に広げるべきだと思う。支払いが早く、お釣りの受け渡しも必要ない。店にとっても、現金を数える手間が減る。ポイントがたまる利点もある。<\/p><p><b>B<\/b><\/p><p>私は、現金も使えるようにしておくことが大切だと考える。災害で停電したときや、機械が故障したときには、キャッシュレスは使えない。また、高齢者の中には操作に慣れていない人も多い。<\/p>", "questions": [{"q": "支払い方法について、AとBはどのように述べているか。", "choices": ["AもBも、現金をなくすべきだと述べている。", "Aは便利さを理由に広げるべきだと述べ、Bは現金も残しておくべきだと述べている。", "AもBも、キャッシュレスに反対している。", "Aは現金を残すべきだと述べ、Bはキャッシュレスを広げるべきだと述べている。"], "answer": 2, "explain": "A promotes cashless; B wants cash kept as a backup."}, {"q": "キャッシュレス決済の問題として、Bが挙げているものはどれか。", "choices": ["停電や故障のときに使えないこと", "ポイントがたまらないこと", "店が現金を数える手間が増えること", "支払いに時間がかかること"], "answer": 1, "explain": "B names blackouts and breakdowns, plus unfamiliarity among older people."}]}]}, {"id": "m13", "section": "read", "label": "問題13", "name": "Long passage (argument)", "instruction": "次の文章を読んで、質問に答えなさい。答えは、1・2・3・4から一つ選びなさい。", "sets": [{"passage": "<p>町の小さな本屋が次々に姿を消している。インターネットで本が買えるようになったことや、電子書籍の普及が主な原因だ。確かに、家から出ずに注文でき、翌日には届く便利さにはかなわない。<\/p><p>しかし、本屋には、ネット書店にない魅力がある。それは、思いがけない本との出会いである。目当ての本を探しに行って、隣の棚で偶然目に留まった一冊に心を動かされた経験は、多くの人にあるだろう。ネットでは、検索した言葉に関連する本しか表示されにくい。<\/p><p>最近では、店主が選んだ本を並べたり、店内に喫茶スペースを設けたりして、「本のある空間」そのものを売る店も出てきた。そうした店は、地域の人々が集まる場所として、新しい役割を担っている。<\/p><p>本屋が減ることは、単に店が一つなくなることではない。偶然の出会いや、人が集まる場が失われることでもある。私たちは、便利さの陰で何を失っているのかを、時々立ち止まって考えるべきではないだろうか。<\/p>", "questions": [{"q": "町の本屋が減っている主な原因は何か。", "choices": ["本の値段が上がったこと", "若者が本を読まなくなったこと", "店主が高齢になったこと", "インターネットでの購入や、電子書籍の普及"], "answer": 4, "explain": "Paragraph 1."}, {"q": "筆者は、本屋の魅力は何だと述べているか。", "choices": ["本が安く買えること", "検索で関連する本がすぐ見つかること", "注文した本が翌日届くこと", "思いがけない本と出会えること"], "answer": 4, "explain": "Paragraph 2."}, {"q": "この文章で、筆者が最も言いたいことは何か。", "choices": ["ネット書店は使うべきではない。", "電子書籍は紙の本より劣っている。", "本屋がなくなると、偶然の出会いや人が集まる場も失われるので、便利さの陰で失うものを考えるべきだ。", "喫茶スペースがある本屋だけが生き残るだろう。"], "answer": 3, "explain": "The final paragraph."}]}]}, {"id": "m14", "section": "read", "label": "問題14", "name": "Information retrieval", "instruction": "下のページは、ある区民センターの講座の案内である。これを読んで、下の質問に答えなさい。答えは、1・2・3・4から一つ選びなさい。", "sets": [{"passage": "<p><b>市民農園　利用案内<\/b><\/p><table class='info'><thead><tr><th>区画<\/th><th>広さ<\/th><th>年間利用料<\/th><\/tr><\/thead><tbody><tr><td>A　小区画<\/td><td>10㎡<\/td><td>6,000円<\/td><\/tr><tr><td>B　中区画<\/td><td>20㎡<\/td><td>10,000円<\/td><\/tr><tr><td>C　大区画<\/td><td>30㎡<\/td><td>14,000円<\/td><\/tr><tr><td>D　車いす対応区画<\/td><td>5㎡<\/td><td>8,000円<\/td><\/tr><\/tbody><\/table><p>・利用期間は、4月から翌年3月までの1年間です。<\/p><p>・区内に住んでいる人は、利用料が1割引になります。<\/p><p>・年度の途中から利用する場合は、残りの月数に応じて、利用料を月割りで計算します。<\/p>", "questions": [{"q": "区内に住む田中さんが、中区画を4月から1年間利用する。利用料はいくらか。", "choices": ["9,000円", "11,000円", "10,000円", "8,000円"], "answer": 1, "explain": "10,000 yen with 10% off = 9,000 yen."}, {"q": "区外に住む山本さんが、10月から翌年3月までの6か月間、大区画を利用する。利用料はいくらか。", "choices": ["12,600円", "14,000円", "6,300円", "7,000円"], "answer": 4, "explain": "14,000 × 6/12 = 7,000 yen. Non-residents get no discount."}]}]}]}]</script>
<script>
(() => {
'use strict';

/* ================= helpers ================= */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2, '0');
const clock = sec => {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
};
const SECTION = { lang: '言語知識（文字・語彙・文法）', read: '読解' };

/* Storage: uses localStorage when the browser allows it, otherwise keeps
   everything in memory for the current tab (e.g. inside sandboxed previews). */
const store = (() => {
  const mem = new Map(); let ls = null;
  try { ls = window.localStorage; ls.setItem('__jt', '1'); ls.removeItem('__jt'); } catch (e) { ls = null; }
  return {
    persistent: !!ls,
    get(k, d) { try { const v = ls ? ls.getItem(k) : mem.get(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { const s = JSON.stringify(v); try { if (ls) ls.setItem(k, s); else mem.set(k, s); } catch (e) { mem.set(k, s); } },
    del(k) { try { if (ls) ls.removeItem(k); } catch (e) {} mem.delete(k); }
  };
})();
const KEY = { custom: 'jlptmock.custom', history: 'jlptmock.history', session: 'jlptmock.session' };

/* ================= tests ================= */
const builtin = JSON.parse($('#builtin-tests').textContent);
let custom = store.get(KEY.custom, []);
const allTests = () => {
  const m = new Map();
  [...builtin, ...custom].forEach(t => m.set(t.id, t));
  return [...m.values()];
};
const testLabel = t => `${t.title}${t.subtitle ? ' - ' + t.subtitle : ''}`;

function validateTest(t) {
  const fail = m => { throw new Error(m); };
  if (!t || typeof t !== 'object' || Array.isArray(t)) fail('The file must contain one test object.');
  if (!t.id || !t.title) fail('Missing "id" or "title".');
  if (!Array.isArray(t.parts) || !t.parts.length) fail('Missing "parts".');
  t.parts.forEach((p, i) => {
    const w = `parts[${i}]`;
    if (!p.label) fail(`${w}: missing "label".`);
    if (p.section !== 'lang' && p.section !== 'read') fail(`${w}: "section" must be "lang" or "read".`);
    const sets = p.sets || (p.questions ? [{ questions: p.questions }] : null);
    if (!sets) fail(`${w}: needs "questions" or "sets".`);
    sets.forEach((s, j) => {
      if (!Array.isArray(s.questions) || !s.questions.length) fail(`${w}, set ${j + 1}: no questions.`);
      s.questions.forEach((q, k) => {
        const x = `${w}, set ${j + 1}, question ${k + 1}`;
        if (!Array.isArray(q.choices) || q.choices.length !== 4) fail(`${x}: needs exactly 4 choices.`);
        if (![1, 2, 3, 4].includes(q.answer)) fail(`${x}: "answer" must be 1, 2, 3 or 4.`);
      });
    });
  });
  return t;
}

function build(raw) {
  let n = 0;
  const qs = [];
  const parts = raw.parts.map((p, pi) => {
    const sets = (p.sets || [{ questions: p.questions }]).map(s => {
      const set = { passage: s.passage || '', qs: [] };
      s.questions.forEach(q => {
        n++;
        const item = { ...q, n, pi, set };
        set.qs.push(item); qs.push(item);
      });
      return set;
    });
    return { ...p, pi, sets, qs: sets.flatMap(s => s.qs) };
  });
  return { id: raw.id, title: raw.title, subtitle: raw.subtitle || '', minutes: raw.minutes || 105, parts, qs, total: n };
}

/* ================= state ================= */
let T = null;      // built test
let S = null;      // session
let tick = null;
let selectedId = null;
let timerPref = true;

const persist = () => { if (S && !S.done) store.set(KEY.session, S); };

/* ================= start screen ================= */
function renderStart(msg) {
  clearInterval(tick); T = null; S = null;
  const tests = allTests();
  if (!tests.find(t => t.id === selectedId)) selectedId = tests[tests.length - 1].id;
  const cur = build(tests.find(t => t.id === selectedId));
  const sess = store.get(KEY.session, null);
  const sessRaw = sess && tests.find(t => t.id === sess.testId);
  const history = store.get(KEY.history, []);

  let resumeHtml = '';
  if (sessRaw) {
    const left = sess.timer ? Math.max(0, (sess.end - Date.now()) / 1000) : null;
    const done = Object.keys(sess.answers).length;
    resumeHtml = `
      <section class="resume">
        <h2>Unfinished test</h2>
        <p>${esc(testLabel(sessRaw))}: ${done} answered${left != null ? `, ${clock(left)} left on the clock` : ', untimed'}.</p>
        <div class="row"><button class="btn" id="resume">Resume</button><button class="btn ghost" id="discard">Discard</button></div>
      </section>`;
  }

  const rows = history.slice().reverse().slice(0, 10).map(h => `
    <tr><td>${new Date(h.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</td>
    <td>${esc(h.label)}</td><td>${h.lang}</td><td>${h.read}</td><td><strong>${h.est}</strong></td></tr>`).join('');

  app.innerHTML = `
  <div class="start">
    <section class="cover stack-pages" aria-labelledby="ct">
      <div class="cover-level" aria-hidden="true">N2</div>
      <h1 id="ct">日本語能力試験 模擬テスト</h1>
      <p class="cover-sub">言語知識（文字・語彙・文法）・読解</p>
      <dl class="facts">
        <div><dt>Time</dt><dd>${cur.minutes} min</dd></div>
        <div><dt>Questions</dt><dd>${cur.total}</dd></div>
        <div><dt>Parts</dt><dd>${cur.parts.length}</dd></div>
      </dl>
      <ol class="notes">
        <li>The clock starts the moment you open the booklet.</li>
        <li>Mark answers on the answer sheet. Tapping a choice in the booklet marks the same bubble.</li>
        <li>You can change answers and move between pages until time is up or you submit.</li>
        <li>There is no listening section here. Do that separately.</li>
      </ol>
      <div class="field"><label for="test-pick">Test</label>
        <select id="test-pick">${tests.map(t => `<option value="${esc(t.id)}"${t.id === selectedId ? ' selected' : ''}>${esc(testLabel(t))}</option>`).join('')}</select>
      </div>
      <label class="check"><input type="checkbox" id="timer-pref"${timerPref ? ' checked' : ''}> Run the ${cur.minutes}-minute timer</label>
      <button class="btn big" id="start">Open the booklet</button>
    </section>
    <div class="side">
      ${resumeHtml}
      <section>
        <h2>Past attempts</h2>
        ${rows ? `<table class="hist"><thead><tr><th>Date</th><th>Test</th><th>Language /60</th><th>Reading /60</th><th>Total /120</th></tr></thead><tbody>${rows}</tbody></table>`
               : `<p>Nothing here yet. Your first result will show up after you submit a test.</p>`}
        ${store.persistent ? '' : `<p class="warnbox">This view can't save to the browser, so history and imported tests last only until you close the tab. Open the file directly in your browser to keep them.</p>`}
      </section>
      <section>
        <h2>Add next week's test</h2>
        <p>Ask Claude for a new test and save the JSON it gives you. Then import it here and it appears in the Test menu.</p>
        <p style="margin-top:12px"><label class="btn ghost file-btn">Import test (.json)<input type="file" id="import" accept=".json,application/json" hidden></label></p>
        ${msg ? `<p class="msg ${msg.ok ? 'ok' : 'err'}" role="status">${esc(msg.text)}</p>` : ''}
      </section>
    </div>
  </div>`;

  $('#test-pick').addEventListener('change', e => { selectedId = e.target.value; renderStart(); });
  $('#timer-pref').addEventListener('change', e => { timerPref = e.target.checked; });
  $('#start').addEventListener('click', () => startTest(selectedId, timerPref));
  $('#resume')?.addEventListener('click', () => resumeTest(sess));
  $('#discard')?.addEventListener('click', () => { store.del(KEY.session); renderStart(); });
  $('#import').addEventListener('change', importFile);
}

function importFile(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      const list = Array.isArray(data) ? data : [data];
      list.forEach(validateTest);
      list.forEach(t => { custom = custom.filter(c => c.id !== t.id); custom.push(t); });
      store.set(KEY.custom, custom);
      selectedId = list[list.length - 1].id;
      renderStart({ ok: true, text: `Imported ${list.length === 1 ? testLabel(list[0]) : list.length + ' tests'}.` });
    } catch (err) {
      renderStart({ ok: false, text: `Couldn't import that file. ${err.message}` });
    }
  };
  r.readAsText(f);
}

/* ================= exam ================= */
function startTest(id, timer) {
  T = build(allTests().find(t => t.id === id));
  const now = Date.now();
  S = { testId: id, timer, start: now, end: timer ? now + T.minutes * 60000 : null, answers: {}, flags: {}, page: 0 };
  persist(); renderExam();
}

function resumeTest(sess) {
  const raw = allTests().find(t => t.id === sess.testId);
  if (!raw) return renderStart();
  T = build(raw); S = sess;
  renderExam();
  if (S.timer && Date.now() >= S.end) finish(true);
}

const fmtStem = s => s.replace(/＿＿＿/g, '<span class="blank">&nbsp;</span>').replace(/★/g, '<span class="blank star">★</span>');
const passageHtml = set => set.passage.replace(/\[\[(\d+)\]\]/g, (_, k) => `<span class="gap">${set.qs[+k - 1] ? set.qs[+k - 1].n : k}</span>`);
const isShort = q => q.choices.every(c => c.replace(/<[^>]+>/g, '').length <= 9);

function questionHtml(q) {
  return `
  <section class="q" id="q-${q.n}">
    <div class="q-head">
      <span class="qno">${q.n}</span>
      <div class="stem">${q.q ? fmtStem(q.q) : `<span class="gapref">${q.n}</span>`}</div>
      <button class="flag" data-n="${q.n}" aria-pressed="false">Flag</button>
    </div>
    <div class="choices ${isShort(q) ? 'inline' : 'stack'}">
      ${q.choices.map((c, i) => `<button class="choice" data-n="${q.n}" data-c="${i + 1}" aria-pressed="false"><span class="cno">${i + 1}</span><span class="ctext">${c}</span></button>`).join('')}
    </div>
  </section>`;
}

function sheetHtml() {
  return T.parts.map(p => `
    ${p.pi === 0 || T.parts[p.pi - 1].section !== p.section ? `<div class="sheet-sec">${SECTION[p.section]}</div>` : ''}
    <section class="sheet-part" data-pi="${p.pi}">
      <h3>${p.label}<span>${p.qs[0].n}-${p.qs[p.qs.length - 1].n}</span></h3>
      <div class="rows">${p.qs.map(q => `
        <div class="srow" data-n="${q.n}">
          <button class="snum" data-n="${q.n}" data-go="${p.pi}" aria-label="Go to question ${q.n}">${q.n}</button>
          ${[1, 2, 3, 4].map(c => `<button class="bubble" data-n="${q.n}" data-c="${c}" aria-pressed="false" aria-label="Question ${q.n}, answer ${c}">${c}</button>`).join('')}
        </div>`).join('')}
      </div>
    </section>`).join('');
}

function renderExam() {
  app.innerHTML = `
  <header class="bar">
    <div class="bar-title"><strong>JLPT N2</strong><span>${esc(testLabel(T))}</span></div>
    <div class="clock" id="clock" role="timer"><span class="clock-label" id="clock-label">Time left</span><span id="clock-time">--:--</span></div>
    <button class="btn" id="submit-top">Submit</button>
  </header>
  <div class="layout">
    <main><article class="page stack-pages" id="page"></article></main>
    <aside class="sheet" id="sheet" aria-label="Answer sheet">
      <div class="sheet-head">
        <h2>解答用紙</h2><small>Answer sheet</small>
        <span class="sheet-count"><span id="answered">0</span>/${T.total}</span>
        <button class="btn ghost sheet-close" id="sheet-close" style="padding:2px 12px">Close</button>
      </div>
      <p class="sheet-hint">Tap a number to jump to that question. Tap a filled bubble again to erase it.</p>
      ${sheetHtml()}
      <div class="sheet-foot"><button class="btn" id="sheet-submit">Submit</button></div>
    </aside>
  </div>
  <button class="sheet-toggle" id="sheet-toggle">解答用紙</button>
  <dialog id="dlg"></dialog>`;

  const page = $('#page'), sheet = $('#sheet');
  page.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.classList.contains('choice')) mark(+b.dataset.n, +b.dataset.c);
    else if (b.classList.contains('flag')) toggleFlag(+b.dataset.n);
    else if (b.dataset.nav) goPage(S.page + (+b.dataset.nav));
    else if (b.dataset.submit) openSubmit();
  });
  sheet.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.classList.contains('bubble')) mark(+b.dataset.n, +b.dataset.c);
    else if (b.classList.contains('snum')) { goPage(+b.dataset.go, +b.dataset.n); sheet.classList.remove('open'); }
    else if (b.id === 'sheet-submit') openSubmit();
    else if (b.id === 'sheet-close') sheet.classList.remove('open');
  });
  $('#sheet-toggle').addEventListener('click', () => sheet.classList.toggle('open'));
  $('#submit-top').addEventListener('click', openSubmit);

  T.qs.forEach(q => paint(q.n));
  goPage(S.page);
  startClock();
}

function renderPage(pi) {
  const p = T.parts[pi];
  $('#page').innerHTML = `
    <div class="page-head"><span>${SECTION[p.section]}</span><span>Page ${pi + 1} of ${T.parts.length}</span></div>
    <div class="mondai"><span class="mondai-tag">${p.label}</span><div class="instr">${p.instruction}</div></div>
    ${p.sets.map(set => `${set.passage ? `<div class="passage">${passageHtml(set)}</div>` : ''}${set.qs.map(questionHtml).join('')}`).join('')}
    <div class="page-foot">
      <button class="btn ghost" data-nav="-1"${pi === 0 ? ' disabled' : ''}>Previous page</button>
      ${pi === T.parts.length - 1 ? `<button class="btn" data-submit="1">Submit</button>` : `<button class="btn ghost" data-nav="1">Next page</button>`}
    </div>`;
  p.qs.forEach(q => paint(q.n));
}

function goPage(pi, n) {
  pi = Math.max(0, Math.min(T.parts.length - 1, pi));
  const changed = pi !== S.page || !$('#page').children.length;
  S.page = pi;
  if (changed) renderPage(pi);
  $$('.sheet-part').forEach(el => el.classList.toggle('current', +el.dataset.pi === pi));
  persist();
  if (n) $(`#q-${n}`)?.scrollIntoView({ block: 'center' });
  else window.scrollTo({ top: 0 });
}

function paint(n) {
  const a = S.answers[n], f = !!S.flags[n];
  $$(`[data-n="${n}"][data-c]`).forEach(b => {
    const on = +b.dataset.c === a;
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
  });
  $$(`.flag[data-n="${n}"]`).forEach(b => {
    b.classList.toggle('on', f); b.setAttribute('aria-pressed', f); b.textContent = f ? 'Flagged' : 'Flag';
  });
  $(`.snum[data-n="${n}"]`)?.classList.toggle('flagged', f);
  const c = $('#answered'); if (c) c.textContent = Object.keys(S.answers).length;
}

function mark(n, c) {
  if (S.answers[n] === c) delete S.answers[n]; else S.answers[n] = c;
  paint(n); persist();
}
function toggleFlag(n) {
  if (S.flags[n]) delete S.flags[n]; else S.flags[n] = true;
  paint(n); persist();
}

function startClock() {
  clearInterval(tick);
  const upd = () => {
    const t = $('#clock-time'); if (!t) return;
    const box = $('#clock'), label = $('#clock-label'), now = Date.now();
    if (S.timer) {
      const left = (S.end - now) / 1000;
      t.textContent = clock(left); label.textContent = 'Time left';
      box.classList.toggle('warn', left <= 900 && left > 300);
      box.classList.toggle('alert', left <= 300);
      if (left <= 0) finish(true);
    } else {
      t.textContent = clock((now - S.start) / 1000); label.textContent = 'Elapsed';
    }
  };
  upd(); tick = setInterval(upd, 500);
}

function openSubmit() {
  const dlg = $('#dlg');
  const answered = Object.keys(S.answers).length, left = T.total - answered, flagged = Object.keys(S.flags).length;
  dlg.innerHTML = `
    <form method="dialog">
      <h2>Submit your answers?</h2>
      <p>${answered} of ${T.total} answered.${left ? ` ${left} still blank.` : ''}${flagged ? ` ${flagged} flagged for review.` : ''} You can't change answers after submitting.</p>
      <div class="dlg-actions"><button class="btn ghost" value="cancel">Keep working</button><button class="btn" value="ok">Submit and score</button></div>
    </form>`;
  dlg.returnValue = '';
  dlg.onclose = () => { if (dlg.returnValue === 'ok') finish(false); };
  dlg.showModal();
}

/* ================= scoring + results ================= */
function score(answers, used) {
  const per = T.parts.map(p => ({
    pi: p.pi, label: p.label, name: p.name || '', section: p.section,
    total: p.qs.length, right: p.qs.filter(q => answers[q.n] === q.answer).length
  }));
  const sec = k => {
    const ps = per.filter(p => p.section === k);
    const total = ps.reduce((a, p) => a + p.total, 0), right = ps.reduce((a, p) => a + p.right, 0);
    return { right, total, scaled: total ? Math.round(right / total * 60) : 0 };
  };
  const lang = sec('lang'), read = sec('read');
  return { per, lang, read, est: lang.scaled + read.scaled, used };
}

function finish(auto) {
  if (!S || S.done) return;
  S.done = true; clearInterval(tick);
  const end = S.timer ? Math.min(Date.now(), S.end) : Date.now();
  const res = score(S.answers, Math.round((end - S.start) / 1000));
  const hist = store.get(KEY.history, []);
  hist.push({ id: T.id, label: testLabel(T), date: new Date().toISOString(), lang: res.lang.scaled, read: res.read.scaled, est: res.est, used: res.used, timer: S.timer });
  store.set(KEY.history, hist);
  store.del(KEY.session);
  renderResults(res, auto);
}

function renderResults(res, auto) {
  const proj = Math.round(res.est / 120 * 180);
  const low = [];
  if (res.lang.scaled < 19) low.push('Language Knowledge');
  if (res.read.scaled < 19) low.push('Reading');
  const ok = !low.length && res.est >= 60;
  const verdict = ok
    ? `If your listening score matches these, the projected total is ${proj} out of 180. The pass line is 90, with at least 19 in every section, so this attempt is on pace.`
    : low.length
      ? `${low.join(' and ')} fell under the 19-point section minimum. A total can't make up for that, so this is the first thing to fix.`
      : `If your listening score matches these, the projected total is ${proj} out of 180. The pass line is 90, so this attempt is below pace.`;
  const weakest = [...res.per].sort((a, b) => a.right / a.total - b.right / b.total)[0];
  const used = clock(res.used);

  const bd = res.per.map(p => `
    <div class="bd${p === weakest ? ' weak' : ''}">
      <div class="nm"><b>${p.label}</b><span>${p.name}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(p.right / p.total * 100)}%"></div></div>
      <div class="val">${p.right}/${p.total}</div>
    </div>`).join('');

  const review = T.qs.map(q => {
    const mine = S.answers[q.n];
    const st = mine == null ? 'skip' : mine === q.answer ? 'ok' : 'no';
    const tag = { skip: 'Blank', ok: 'Correct', no: 'Incorrect' }[st];
    const part = T.parts[q.pi];
    return `
    <article class="rv ${st}" data-st="${st}" data-flag="${S.flags[q.n] ? 1 : 0}">
      <div class="rv-head"><b>${q.n}</b><span>${part.label} ${esc(part.name || '')}</span><span class="tag">${tag}</span>${S.flags[q.n] ? '<span class="rv-flag">Flagged</span>' : ''}</div>
      <div class="stem">${q.q ? fmtStem(q.q) : `<span class="gapref">${q.n}</span>`}</div>
      <ol>${q.choices.map((c, i) => `<li class="${i + 1 === q.answer ? 'right' : ''} ${i + 1 === mine ? 'mine' : ''}"><span class="cno">${i + 1}</span><span>${c}</span><em>${i + 1 === q.answer ? 'Correct answer' : ''}${i + 1 === mine && mine !== q.answer ? 'Your answer' : ''}${i + 1 === mine && mine === q.answer ? ' (yours)' : ''}</em></li>`).join('')}</ol>
      ${q.explain ? `<p class="explain">${q.explain}</p>` : ''}
      ${q.set.passage ? `<details><summary>Show passage</summary><div class="passage">${passageHtml(q.set)}</div></details>` : ''}
    </article>`;
  }).join('');

  app.innerHTML = `
  <div class="results">
    <section class="res-top stack-pages">
      <h1>${esc(testLabel(T))}: result</h1>
      <p class="sub">${auto ? 'Time ran out, so your answers were submitted automatically. ' : ''}Time used: ${used}${S.timer ? '' : ' (untimed)'}</p>
      <div class="scores">
        <div class="score"><small>Language Knowledge</small><b>${res.lang.scaled}<i> / 60</i></b><small>${res.lang.right} of ${res.lang.total} correct</small></div>
        <div class="score"><small>Reading</small><b>${res.read.scaled}<i> / 60</i></b><small>${res.read.right} of ${res.read.total} correct</small></div>
        <div class="score"><small>Total without listening</small><b>${res.est}<i> / 120</i></b><small>Projected ${proj} / 180</small></div>
      </div>
      <p class="verdict">${verdict}</p>
      <p class="fine">Section scores are your percentage correct scaled to 60. The real JLPT uses equated scoring, so treat these as a guide rather than a prediction. Weakest part this time: ${weakest.label} ${esc(weakest.name)} (${weakest.right}/${weakest.total}).</p>
      <div class="breakdown">${bd}</div>
      <div class="res-actions">
        <button class="btn" id="retake">Retake this test</button>
        <button class="btn ghost" id="home">Back to start</button>
      </div>
    </section>
    <section class="review" id="review">
      <h2>Review</h2>
      <div class="chips" role="group" aria-label="Filter questions">
        <button class="chip" data-f="all" aria-pressed="true">All ${T.total}</button>
        <button class="chip" data-f="no" aria-pressed="false">Incorrect</button>
        <button class="chip" data-f="skip" aria-pressed="false">Blank</button>
        <button class="chip" data-f="flag" aria-pressed="false">Flagged</button>
      </div>
      <div id="rv-list">${review}</div>
    </section>
  </div>`;
  window.scrollTo({ top: 0 });
  $('#retake').addEventListener('click', () => startTest(T.id, S.timer));
  $('#home').addEventListener('click', () => renderStart());
  $('.chips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    $$('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
    const f = b.dataset.f;
    $$('.rv').forEach(r => r.classList.toggle('hide', !(f === 'all' || (f === 'flag' ? r.dataset.flag === '1' : r.dataset.st === f))));
  });
}

renderStart();
})();
</script>
</body>
</html>
